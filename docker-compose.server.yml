# ── Déploiement sur un serveur simple (VPS Contabo/OVH…), accès http://IP ────
# Construit tout depuis le code source : Postgres + backend + frontend.
# Aucun domaine ni HTTPS (Caddy) — pour un environnement de test partagé.
#
# Usage :
#   docker compose -f docker-compose.server.yml --env-file .env.server up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alasource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-alasource}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alasource}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    # Migrations + création admin/données de démo, puis serveur
    command: sh -c "alembic upgrade head && python -m app.initial_data && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-alasource}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alasource}
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: ${PUBLIC_URL}
      FRONTEND_URL: ${PUBLIC_URL}
      EMAIL_BACKEND: console
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@alasource.fr}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-changeme-admin}
      SEED_SUPPLIER_PASSWORD: ${SEED_SUPPLIER_PASSWORD:-fournisseur123}
    volumes:
      - uploads:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"          # le site est servi sur http://IP (port 80)
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
